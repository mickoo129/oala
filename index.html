<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港醫院查詢目錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F3460',
                        secondary: '#1A73E8',
                        accent: '#E94560',
                        neutral: '#5F6368',
                        light: '#F8F9FA',
                        dark: '#202124'
                    },
                    fontFamily: {
                        sans: ['Noto Sans HK', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .shadow-pro {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .transition-pro {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .card-hover {
                @apply hover:shadow-lg hover:-translate-y-1 transition-pro;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-dark">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white shadow-md transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center mb-4 md:mb-0">
                <i class="fa fa-hospital-o text-primary text-3xl mr-3"></i>
                <h1 class="text-2xl font-bold text-primary">香港醫院查詢目錄</h1>
            </div>
            <div class="flex items-center">
                <button id="favorites-btn" class="p-2 rounded-full hover:bg-gray-100 transition-pro relative">
                    <i class="fa fa-star-o text-neutral"></i>
                    <span id="favorites-count" class="absolute -top-1 -right-1 bg-accent text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 搜索和筛选区域 -->
        <section class="mb-8 bg-white rounded-xl shadow-pro p-6">
            <div class="mb-6">
                <div class="relative">
                    <i class="fa fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-neutral"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="搜索醫院名稱、服務或地址..." 
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                <!-- 地区筛选 -->
                <div>
                    <label class="block text-sm font-medium text-neutral mb-2">地區</label>
                    <select id="district-filter" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro">
                        <option value="all">所有地區</option>
                        <option value="hongkong">香港島</option>
                        <option value="kowloon">九龍</option>
                        <option value="newterritories">新界</option>
                    </select>
                </div>

                <!-- 医院类型筛选 -->
                <div>
                    <label class="block text-sm font-medium text-neutral mb-2">醫院類型</label>
                    <select id="type-filter" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro">
                        <option value="all">所有類型</option>
                        <option value="public">公立醫院</option>
                        <option value="private">私家醫院</option>
                    </select>
                </div>

                <!-- 服务筛选 -->
                <div>
                    <label class="block text-sm font-medium text-neutral mb-2">主要服務</label>
                    <select id="service-filter" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro">
                        <option value="all">所有服務</option>
                        <option value="emergency">24小時急症室</option>
                        <option value="children">兒童病房及服務</option>
                        <option value="maternity">產科及婦科服務</option>
                        <option value="cardiology">心臟科服務</option>
                        <option value="orthopedics">骨科服務</option>
                        <option value="oncology">腫瘤科服務</option>
                        <option value="neurology">神經科服務</option>
                        <option value="ophthalmology">眼科服務</option>
                        <option value="dental">牙科服務</option>
                        <option value="psychiatry">精神科服務</option>
                    </select>
                </div>
            </div>

            <!-- 高级筛选按钮 -->
            <div class="mb-6">
                <button id="advanced-filter-btn" class="flex items-center text-secondary hover:text-primary transition-pro text-sm">
                    <i class="fa fa-sliders mr-2"></i> 高級篩選選項
                    <i class="fa fa-chevron-down ml-2 text-xs transition-transform duration-300" id="advanced-icon"></i>
                </button>

                <!-- 高级筛选内容 -->
                <div id="advanced-filters" class="hidden mt-4 pt-4 border-t border-gray-100 grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-neutral mb-2">保險合作</label>
                        <select id="insurance-filter" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro">
                            <option value="all">所有</option>
                            <option value="ha">醫管局計劃</option>
                            <option value="international">國際保險</option>
                            <option value="both">兩者皆可</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-neutral mb-2">設施</label>
                        <select id="facility-filter" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro">
                            <option value="all">所有</option>
                            <option value="parking">停車場</option>
                            <option value="pharmacy">24小時藥房</option>
                            <option value="accessibility">無障礙設施</option>
                            <option value="cafeteria">餐廳/咖啡廳</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 快速筛选标签 -->
            <div class="flex flex-wrap gap-2">
                <button class="quick-filter px-4 py-2 bg-primary/10 text-primary rounded-full text-sm hover:bg-primary/20 transition-pro" data-filter="emergency">
                    <i class="fa fa-ambulance mr-1"></i> 急症室
                </button>
                <button class="quick-filter px-4 py-2 bg-primary/10 text-primary rounded-full text-sm hover:bg-primary/20 transition-pro" data-filter="children">
                    <i class="fa fa-child mr-1"></i> 兒童服務
                </button>
                <button class="quick-filter px-4 py-2 bg-primary/10 text-primary rounded-full text-sm hover:bg-primary/20 transition-pro" data-filter="maternity">
                    <i class="fa fa-female mr-1"></i> 產科服務
                </button>
                <button class="quick-filter px-4 py-2 bg-primary/10 text-primary rounded-full text-sm hover:bg-primary/20 transition-pro" data-filter="public">
                    <i class="fa fa-building mr-1"></i> 公立醫院
                </button>
                <button class="quick-filter px-4 py-2 bg-primary/10 text-primary rounded-full text-sm hover:bg-primary/20 transition-pro" data-filter="private">
                    <i class="fa fa-hospital mr-1"></i> 私家醫院
                </button>
                <button id="reset-filters" class="ml-auto px-4 py-2 bg-gray-100 text-neutral rounded-full text-sm hover:bg-gray-200 transition-pro">
                    <i class="fa fa-refresh mr-1"></i> 重置篩選
                </button>
            </div>
        </section>

        <!-- 统计和排序区域 -->
        <section class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center">
            <div>
                <h2 class="text-xl font-bold flex items-center">
                    <span id="results-count">0</span> 間醫院
                    <span class="ml-3 text-sm font-normal text-neutral">
                        <span id="public-count">0</span> 公立 · <span id="private-count">0</span> 私家
                    </span>
                </h2>
                <p class="text-sm text-neutral mt-1">數據最後更新: <span id="last-update">2023年10月</span></p>
            </div>
            <div class="flex items-center mt-4 md:mt-0">
                <label class="text-sm text-neutral mr-2">排序:</label>
                <select id="sort-options" class="p-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-pro text-sm">
                    <option value="name">按名稱 (A-Z)</option>
                    <option value="name-desc">按名稱 (Z-A)</option>
                    <option value="district">按地區</option>
                    <option value="type">按類型</option>
                </select>
            </div>
        </section>

        <!-- 医院列表区域 -->
        <section>
            <div id="hospitals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 医院卡片将通过JavaScript动态生成 -->
            </div>

            <!-- 加载中状态 -->
            <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                <p class="text-neutral">正在載入醫院資料...</p>
            </div>

            <!-- 空状态显示 -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
                <i class="fa fa-search text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-xl font-medium text-neutral mb-2">沒有找到符合條件的醫院</h3>
                <p class="text-gray-400 max-w-md">請嘗試調整搜索條件或使用不同的關鍵詞</p>
                <button id="empty-reset" class="mt-4 px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-pro">
                    重置所有篩選
                </button>
            </div>
        </section>

        <!-- 分页控制 -->
        <div id="pagination" class="mt-10 flex justify-center items-center hidden">
            <button id="prev-page" class="px-4 py-2 border border-gray-300 rounded-l-lg hover:bg-gray-50 transition-pro disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="fa fa-chevron-left"></i>
            </button>
            <div id="page-numbers" class="flex">
                <!-- 页码将通过JavaScript动态生成 -->
            </div>
            <button id="next-page" class="px-4 py-2 border border-gray-300 rounded-r-lg hover:bg-gray-50 transition-pro">
                <i class="fa fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <!-- 医院详情模态框 -->
    <div id="hospital-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="modal-backdrop"></div>
        <div class="relative bg-white rounded-xl shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
            <button id="close-modal" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-white/80 hover:bg-white shadow-md transition-pro">
                <i class="fa fa-times text-neutral"></i>
            </button>
            <div id="modal-content" class="p-6">
                <!-- 模态框内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 收藏夹模态框 -->
    <div id="favorites-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="favorites-backdrop"></div>
        <div class="relative bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold text-primary">我的收藏</h3>
                    <button id="close-favorites" class="p-2 rounded-full hover:bg-gray-100 transition-pro">
                        <i class="fa fa-times text-neutral"></i>
                    </button>
                </div>
            </div>
            <div id="favorites-content" class="p-6">
                <!-- 收藏内容将通过JavaScript动态生成 -->
                <div id="empty-favorites" class="flex flex-col items-center justify-center py-16 text-center">
                    <i class="fa fa-star-o text-6xl text-gray-300 mb-4"></i>
                    <h4 class="text-lg font-medium text-neutral mb-2">您還沒有收藏任何醫院</h4>
                    <p class="text-gray-400 max-w-md">點擊醫院卡片上的星星圖標將醫院添加到收藏夾</p>
                </div>
            </div>
        </div>
    </div>

        // 渲染医院列表
        function renderHospitals(hospitalsList) {
            hospitalsContainer.innerHTML = '';
            
            // 更新统计数据
            const publicHospitals = hospitalsList.filter(h => h.type === 'public');
            const privateHospitals = hospitalsList.filter(h => h.type === 'private');
            publicCount.textContent = publicHospitals.length;
            privateCount.textContent = privateHospitals.length;

            if (hospitalsList.length === 0) {
                emptyState.classList.remove('hidden');
                pagination.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            // 分页处理
            const totalPages = Math.ceil(hospitalsList.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = hospitalsList.slice(startIndex, endIndex);
            
            // 显示分页控件
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                renderPagination(totalPages);
                
                // 更新分页按钮状态
                prevPage.disabled = currentPage === 1;
                nextPage.disabled = currentPage === totalPages;
            } else {
                pagination.classList.add('hidden');
            }

            currentItems.forEach(hospital => {
                const isFavorite = favorites.includes(hospital.id);
                const hospitalCard = document.createElement('div');
                hospitalCard.className = 'bg-white rounded-xl shadow-pro overflow-hidden card-hover';
                hospitalCard.dataset.id = hospital.id;

                // 医院类型标签颜色
                const typeColor = hospital.type === 'public' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800';

                });

        // 渲染分页
        function renderPagination(totalPages) {
            pageNumbers.innerHTML = '';
            
            // 显示当前页前后各2页，加上第一页和最后一页
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            
            // 如果前面有更多页，显示省略号
            if (startPage > 1) {
                addPageNumber(1);
                if (startPage > 2) {
                    addEllipsis();
                }
            }
            
            // 显示页码
            for (let i = startPage; i <= endPage; i++) {
                addPageNumber(i);
            }
            
            // 如果后面有更多页，显示省略号
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    addEllipsis();
                }
                addPageNumber(totalPages);
            }
        }
        
        // 添加页码
        function addPageNumber(page) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `px-4 py-2 border-t border-b ${page === currentPage ? 'bg-primary text-white border-primary' : 'border-gray-300 hover:bg-gray-50'} transition-pro`;
            pageBtn.textContent = page;
            
            // 移除第一页和最后一页的左侧/右侧边框
            if (page === 1) {
                pageBtn.classList.add('rounded-l-lg', 'border-l');
            } else if (page === Math.ceil(filteredHospitals.length / itemsPerPage)) {
                pageBtn.classList.add('rounded-r-lg', 'border-r');
            }
            
            pageBtn.addEventListener('click', () => {
                currentPage = page;
                renderHospitals(filteredHospitals);
            });
            
            pageNumbers.appendChild(pageBtn);
        }
        
        // 添加省略号

            const ellipsis = document.createElement('span');
            ellipsis.className = 'px-2 py-2 text-neutral';

                            ${hospital.facilities.map(facility => {
                                let icon = 'fa-check';
                                if (facility === '停車場') icon = 'fa-parking';
                                else if (facility === '藥房') icon = 'fa-medkit';
                                else if (facility === '輪椅租借') icon = 'fa-wheelchair';
                                else if (facility === '餐廳') icon = 'fa-utensils';
                                else if (facility === '便利店') icon = 'fa-shopping-bag';
                                else if (facility === '禮品店') icon = 'fa-gift';
                                else if (facility === '咖啡廳') icon = 'fa-coffee';
                                else if (facility === 'accessibility') {
                                    facility = '無障礙設施';
                                    icon = 'fa-universal-access';
                                }
                                
                                return `<li><i class="fa ${icon} text-green-500 mr-2"></i>${facility}</li>`;
                            }).join('')}
                        </ul>
                    </div>

                    <div>
                        <h4 class="text-lg font-medium mb-3 flex items-center">
                            <i class="fa fa-credit-card text-primary mr-2"></i> 保險信息
                        </h4>
                        <p class="text-neutral">${insuranceText}</p>
                        <p class="text-sm text-gray-500 mt-1">適用於大多數醫療保險計劃，建議事先與保險公司確認</p>
                    </div>
                </div>

                <div>
                    <h4 class="text-lg font-medium mb-3 flex items-center">
                        <i class="fa fa-bus text-primary mr-2"></i> 交通指南
                    </h4>
                    <p class="text-neutral">${hospital.transport}</p>
                </div>
            `;

            hospitalModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            // 添加收藏按钮事件
            modalContent.querySelector('.modal-favorite-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(e.currentTarget.dataset.id);
                toggleFavorite(id);
            });
        }

        // 关闭医院详情模态框
        function closeHospitalModal() {
            hospitalModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // 切换收藏状态
        function toggleFavorite(hospitalId) {
            const index = favorites.indexOf(hospitalId);
            if (index === -1) {
                favorites.push(hospitalId);
                showNotification('已添加到收藏夾');
            } else {
                favorites.splice(index, 1);
                showNotification('已從收藏夾移除');
            }

            // 保存到本地存储
            localStorage.setItem('hospitalFavorites', JSON.stringify(favorites));
            
            // 更新UI
            updateFavoritesCount();
            renderHospitals(filteredHospitals);
            renderFavorites();
            checkFavoritesEmpty();
        }

        // 显示通知
        function showNotification(message) {
            // 检查是否已有通知
            let notification = document.getElementById('notification');
            if (notification) {
                notification.remove();
            }
            
            // 创建新通知
            notification = document.createElement('div');
            notification.id = 'notification';
            notification.className = 'fixed bottom-4 right-4 bg-primary text-white px-4 py-2 rounded-lg shadow-lg z-50 transform transition-all duration-300 translate-y-0';
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // 3秒后隐藏通知
            setTimeout(() => {
                notification.classList.add('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // 更新收藏数量
        function updateFavoritesCount() {
            favoritesCount.textContent = favorites.length;
        }

        // 检查收藏是否为空
        function checkFavoritesEmpty() {
            if (favorites.length === 0) {
                emptyFavorites.classList.remove('hidden');
            } else {
                emptyFavorites.classList.add('hidden');
            }
        }

        // 渲染收藏列表
        function renderFavorites() {
            if (favorites.length === 0) return;

            const favoriteHospitals = hospitals.filter(hospital => favorites.includes(hospital.id));
            favoritesContent.innerHTML = '';

            favoriteHospitals.forEach(hospital => {
                const favoriteItem = document.createElement('div');
                favoriteItem.className = 'flex justify-between items-center p-4 border-b last:border-0 hover:bg-gray-50 transition-pro';
                
                const typeText = hospital.type === 'public' ? '公立' : '私家';
                const typeColor = hospital.type === 'public' ? 'text-blue-600' : 'text-green-600';

                favoriteItem.innerHTML = `
                    <div>
                        <h4 class="font-medium">${hospital.name}</h4>
                        <p class="text-sm text-neutral">${hospital.districtName} · <span class="${typeColor}">${typeText}</span>
                        ${hospital.emergency ? '<span class="ml-2 text-xs bg-red-100 text-red-800 px-1.5 py-0.5 rounded">有急症室</span>' : ''}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="view-favorite-details p-2 text-primary hover:bg-primary/10 rounded-full transition-pro" data-id="${hospital.id}">
                            <i class="fa fa-eye"></i>
                        </button>
                        <button class="remove-favorite p-2 text-red-400 hover:bg-red-50 rounded-full transition-pro" data-id="${hospital.id}">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                `;

                favoritesContent.appendChild(favoriteItem);
            });

            // 添加事件监听器
            document.querySelectorAll('.view-favorite-details').forEach(button => {
                button.addEventListener('click', () => {
                    const hospitalId = parseInt(button.dataset.id);
                    closeFavoritesModal();
                    openHospitalModal(hospitalId);
                });
            });

            document.querySelectorAll('.remove-favorite').forEach(button => {
                button.addEventListener('click', () => {
                    const hospitalId = parseInt(button.dataset.id);
                    toggleFavorite(hospitalId);
                });
            });
        }

        // 打开收藏夹模态框
        function openFavoritesModal() {
            renderFavorites();
            favoritesModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // 关闭收藏夹模态框
        function closeFavoritesModal() {
            favoritesModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // 筛选医院
        function filterHospitals() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const district = districtFilter.value;
            const type = typeFilter.value;
            const service = serviceFilter.value;
            const insurance = insuranceFilter.value;
            const facility = facilityFilter.value;

            return hospitals.filter(hospital => {
                // 搜索词筛选
                const matchesSearch = searchTerm === '' || 
                    hospital.name.toLowerCase().includes(searchTerm) ||
                    hospital.nameEn.toLowerCase().includes(searchTerm) ||
                    hospital.address.toLowerCase().includes(searchTerm) ||
                    hospital.speciality?.toLowerCase().includes(searchTerm) ||
                    hospital.services.some(s => getServiceBadge(s).toLowerCase().includes(searchTerm));

                // 地区筛选
                const matchesDistrict = district === 'all' || hospital.district === district;

                // 类型筛选
                const matchesType = type === 'all' || hospital.type === type;

                // 服务筛选
                const matchesService = service === 'all' || (service === 'emergency' ? hospital.emergency : hospital.services.includes(service));

                // 保险筛选
                const matchesInsurance = insurance === 'all' ||
                    (insurance === 'ha' && hospital.insurance.includes('ha')) ||
                    (insurance === 'international' && hospital.insurance.includes('international')) ||
                    (insurance === 'both' && hospital.insurance.includes('ha') && hospital.insurance.includes('international'));

                // 设施筛选
                const matchesFacility = facility === 'all' || 
                    (facility === 'parking' && hospital.facilities.includes('停車場')) ||
                    (facility === 'pharmacy' && hospital.facilities.includes('藥房')) ||
                    (facility === 'accessibility' && hospital.facilities.includes('accessibility')) ||
                    (facility === 'cafeteria' && (hospital.facilities.includes('餐廳') || hospital.facilities.includes('咖啡廳')));

                return matchesSearch && matchesDistrict && matchesType && matchesService && matchesInsurance && matchesFacility;
            });
        }

        // 排序医院
        function sortHospitals(hospitalsList) {
            const sortBy = sortOptions.value;
            return [...hospitalsList].sort((a, b) => {
                switch(sortBy) {
                    case 'name':
                        return a.name.localeCompare(b.name, 'zh-Hant');
                    case 'name-desc':
                        return b.name.localeCompare(a.name, 'zh-Hant');
                    case 'district':
                        return a.district.localeCompare(b.district);
                    case 'type':
                        return a.type.localeCompare(b.type);
                    default:
                        return 0;
                }
            });
        }

        // 应用筛选和排序
        function applyFilters() {
            currentPage = 1; // 重置为第一页
            const filtered = filterHospitals();
            filteredHospitals = sortHospitals(filtered);
            resultsCount.textContent = filteredHospitals.length;
            renderHospitals(filteredHospitals);
        }

        // 重置筛选
        function resetAllFilters() {
            searchInput.value = '';
            districtFilter.value = 'all';
            typeFilter.value = 'all';
            serviceFilter.value = 'all';
            insuranceFilter.value = 'all';
            facilityFilter.value = 'all';
            applyFilters();
        }

        // 事件监听器
        searchInput.addEventListener('input', applyFilters);
        districtFilter.addEventListener('change', applyFilters);
        typeFilter.addEventListener('change', applyFilters);
        serviceFilter.addEventListener('change', applyFilters);
        insuranceFilter.addEventListener('change', applyFilters);
        facilityFilter.addEventListener('change', applyFilters);
        sortOptions.addEventListener('change', applyFilters);

        quickFilters.forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;
                
                // 检查是服务筛选还是类型筛选
                if (['emergency', 'children', 'maternity', 'cardiology', 'orthopedics', 'oncology', 'neurology', 'ophthalmology', 'dental', 'psychiatry'].includes(filter)) {
                    serviceFilter.value = filter;
                } else if (['public', 'private'].includes(filter)) {
                    typeFilter.value = filter;
                }
                
                applyFilters();
            });
        });

        resetFilters.addEventListener('click', resetAllFilters);
        emptyReset.addEventListener('click', resetAllFilters);

        closeModal.addEventListener('click', closeHospitalModal);
        modalBackdrop.addEventListener('click', closeHospitalModal);

        favoritesBtn.addEventListener('click', openFavoritesModal);
        closeFavorites.addEventListener('click', closeFavoritesModal);
        favoritesBackdrop.addEventListener('click', closeFavoritesModal);

        // 高级筛选切换
        advancedFilterBtn.addEventListener('click', () => {
            advancedFilters.classList.toggle('hidden');
            advancedIcon.classList.toggle('rotate-180');
        });

        // 分页控制
        prevPage.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderHospitals(filteredHospitals);
            }
        });

        nextPage.addEventListener('click', () => {
            if (currentPage < Math.ceil(filteredHospitals.length / itemsPerPage)) {
                currentPage++;
                renderHospitals(filteredHospitals);
            }
        });

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeHospitalModal();
                closeFavoritesModal();
            }
        });
    </script>
</body>
</html>
